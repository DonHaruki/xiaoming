<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="读书、写作与骑行。">
<meta name="robots" content="noindex,nofollow,noarchive,noimageindex,noai,noimageai">
<meta name="theme-color" content="#F3FAFE">
<title>微明 · xiaoming</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-album="day">

<header id="site-header" data-album="day">
  <div class="wrap">
    <a class="wordmark" href="#top">微明<span class="wm-en">xiaoming</span></a>
    <nav aria-label="段落导航">
      <a href="#day" data-nav="day" aria-current="page">Day</a>
      <a href="#dusk" data-nav="dusk">Dusk</a>
      <a href="#night" data-nav="night">Night</a>
    </nav>
    <span class="micro" id="header-meta">OCEAN SIDE</span>
  </div>
</header>

<main>

  <section class="band" id="top" data-band="day" data-album="day">
    <div class="wrap hero expose">
      <h1 class="site-title"><span class="title-zh">微明</span><span class="mark-day" aria-hidden="true"></span><span class="title-en">xiaoming</span></h1>
      <p class="tagline">读书 · 写作 · 骑行</p>
      <blockquote class="epigraph">
        <button type="button" class="quote-trigger" data-essay="day-008">
          <span class="epigraph-line">目光所及即存在，道听途说非真理。</span>
          <span class="epigraph-cite micro">《单车志vol1—中心地带》· 2023-05-04</span>
        </button>
      </blockquote>
    </div>

    <div class="wrap band-grid" id="day">
      <div class="main-col">
        <div class="band-head"><h2 class="ttl ttl-day">昼 · 写作</h2></div>

        <div class="field-row">
          <div class="field">
            <label class="label-cn" for="q">检索</label>
            <input id="q" type="search" placeholder="书名 / 2024-04 / 单车" autocomplete="off">
          </div>
        </div>
        <div class="sheet-tools">
          <span class="micro" id="search-status" aria-live="polite"></span>
          <button class="btn btn-quiet" id="day-expand" type="button">全部</button>
        </div>
        <div class="filter-row" id="day-filters" aria-label="按类别筛选"></div>
        <div class="contact-sheet" id="sheet-day" aria-label="写作"></div>

        <div class="quote-tail">
          <button type="button" class="quote-trigger" data-essay="day-010">
            <span class="quote">我觉得自己就是对联上的一个字，虚飘飘的，不落实地。</span>
            <span class="quote-cite micro">《整理国故》· 2026-10-02</span>
          </button>
        </div>
      </div>
      <aside class="margin-note" id="quotes-day" aria-label="摘句"></aside>
    </div>
  </section>

  <section class="band" id="dusk" data-band="dusk" data-album="dusk">
    <div class="wrap band-grid">
      <div class="main-col">
        <div class="band-head">
          <div class="ttl-row"><h2 class="ttl ttl-dusk">黄昏 · 阅读</h2><span class="ring" aria-hidden="true"></span></div>
        </div>

        <div class="sec-head"><h3>文艺评论</h3></div>
        <div class="sheet-tools">
          <span class="micro" id="dusk-status"></span>
          <button class="btn btn-quiet" id="dusk-expand" type="button">全部</button>
        </div>
        <div class="contact-sheet" id="sheet-dusk" aria-label="文艺评论"></div>

        <div class="sec-head"><h3>读过</h3></div>
        <div class="sheet-tools">
          <span class="micro" id="book-status"></span>
          <button class="btn btn-quiet" id="book-expand" type="button">全部</button>
        </div>
        <div class="contact-sheet" id="sheet-books" aria-label="书目"></div>

        <div class="quote-tail">
          <button type="button" class="quote-trigger" data-essay="dusk-122">
            <span class="quote">喜欢听一首歌，不如说是喜欢听人说话。</span>
            <span class="quote-cite micro">《再论日本音乐》· 2024-06-21</span>
          </button>
        </div>
      </div>
      <aside class="margin-note" id="quotes-dusk" aria-label="摘句"></aside>
    </div>
  </section>

  <section class="band" id="night" data-band="night" data-album="night">
    <div class="wrap band-grid">
      <div class="main-col">
        <div class="band-head"><h2 class="ttl ttl-night">夜 · 诗</h2></div>

        <div class="sec-head"><h3>三首</h3></div>
        <div class="verse-set" id="verse-set" aria-label="诗"></div>

        <div class="sec-head"><h3>诗歌与小品</h3></div>
        <div class="sheet-tools">
          <span class="micro" id="night-status"></span>
          <button class="btn btn-quiet" id="night-expand" type="button">全部</button>
        </div>
        <div class="contact-sheet" id="sheet-night" aria-label="诗歌"></div>

        <div class="quote-tail">
          <button type="button" class="quote-trigger" data-essay="day-013">
            <span class="quote">但我认出来了。</span>
            <span class="quote-cite micro">《蔷薇刺上的宿泪》· 2026-05-23</span>
          </button>
        </div>
      </div>
      <aside class="margin-note" id="quotes-night" aria-label="摘句"></aside>
    </div>
  </section>

</main>

<footer data-album="night">
  <div class="wrap">
    <span class="micro">微明 · xiaoming</span>
    <span class="micro">OCEAN SIDE / ADVENTURE / TROPIC OF CAPRICORN</span>
  </div>
</footer>

<div class="reader" id="reader" data-album="day" hidden role="dialog" aria-modal="true" aria-labelledby="reader-title">
  <div class="reader-bar">
    <div class="wrap">
      <div class="reader-bar-group">
        <span class="micro" id="reader-album">OCEAN SIDE</span>
        <button class="btn btn-quiet btn-label" id="reader-back" type="button" hidden>Back</button>
      </div>
      <div class="reader-bar-group">
        <button class="btn btn-quiet btn-label" id="reader-copy" type="button">Link</button>
        <button class="btn btn-quiet btn-label" id="reader-close" type="button">Close</button>
      </div>
    </div>
  </div>
  <article class="reader-article wrap">
    <div class="r-head">
      <h2 id="reader-title"></h2>
      <div class="r-meta" id="reader-meta"></div>
    </div>
    <div class="r-body" id="reader-body"></div>
    <div class="echo" id="reader-echo"></div>
  </article>
</div>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
