name: Import university memories page

on:
  push:
    paths:
      - '.github/workflows/import-university-memories.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download page
        run: |
          mkdir -p university-memories
          curl -L --fail --retry 3 --retry-delay 2 -o university-memories/index.html "https://aka.doubaocdn.com/s/ZLuZW9wPPg"
          ls -lh university-memories/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add university-memories/index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Import university memories page"
          git push
